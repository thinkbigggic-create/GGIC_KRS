<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>경기인천 KRS LIVE Board</title>
<style>
:root{--navy:#14233c;--blue:#2563eb;--bg:#eef2f7;--line:#dce3ec;--muted:#667085;--card:#fff;--green:#1f9d63}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:var(--bg);color:#172033}
header{position:sticky;top:0;z-index:10;background:var(--navy);color:#fff;padding:16px 22px;box-shadow:0 2px 14px rgba(0,0,0,.15)}
.top{display:flex;justify-content:space-between;gap:18px;align-items:end;max-width:1720px;margin:auto}
h1{margin:0;font-size:32px;letter-spacing:-.5px}
header p{margin:6px 0 0;color:#d7deea;font-size:15px}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:8px 11px;font-weight:800;font-size:14px}
main{max-width:1720px;margin:16px auto;padding:0 18px 28px}
.branch-strip{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin-bottom:12px}
.branch-chip{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 5px;text-align:center;font-weight:800;font-size:13px;color:#667085}
.branch-chip.on{background:#eaf7f1;border-color:#b7e4ce;color:#157a4d}
.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}
.toolbar .left{display:flex;gap:8px;flex-wrap:wrap}
button,select{border:1px solid #cbd5e1;background:#fff;border-radius:10px;padding:9px 12px;font-size:14px;font-weight:700;cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 3px 12px rgba(15,23,42,.05)}
.card.new{outline:3px solid #c9ddff}
.cardhead{padding:14px 16px;background:#f7f9fc;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}
.branch{font-size:20px;font-weight:900;letter-spacing:-.3px}
.amount{font-size:20px;font-weight:900;color:var(--blue);white-space:nowrap}
.body{padding:16px}
.group{font-size:22px;font-weight:900;color:#214c9a;line-height:1.35;margin-bottom:12px}
.row{margin-top:12px;line-height:1.55;font-size:17px}
.row b{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.courses{display:flex;flex-wrap:wrap;gap:6px}
.course{background:#edf2f7;border-radius:999px;padding:6px 9px;font-size:13px;font-weight:800}
.speech{background:#f8fafc;border-radius:12px;padding:11px 12px}
.footer{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid #edf0f4}
.time{font-size:12px;color:var(--muted)}
.like{background:#eef3ff;color:#244a9b;border-color:#d8e5ff;font-weight:900}
.empty{grid-column:1/-1;text-align:center;background:#fff;border:1px dashed #cbd5e1;border-radius:16px;padding:80px 20px;color:var(--muted);font-size:20px}
@media(max-width:1200px){.branch-strip{grid-template-columns:repeat(4,1fr)}.cards{grid-template-columns:1fr}}
@media(max-width:760px){.top{align-items:flex-start;flex-direction:column}.stats{justify-content:flex-start}.branch-strip{grid-template-columns:repeat(2,1fr)}h1{font-size:25px}}
</style>
</head>
<body>
<header>
  <div class="top">
    <div>
      <h1>경기인천 KRS LIVE Board</h1>
      <p>지국장 과목 컨설팅 · 실시간 공유</p>
    </div>
    <div class="stats">
      <div class="stat">등록 <span id="count">0</span>건</div>
      <div class="stat">참여 지국 <span id="branchCount">0</span>/16</div>
      <div class="stat">3초 자동 갱신</div>
    </div>
  </div>
</header>

<main>
  <div id="branchStrip" class="branch-strip"></div>

  <div class="toolbar">
    <div class="left">
      <select id="sort">
        <option value="latest">최신순</option>
        <option value="likes">공감순</option>
      </select>
      <select id="filter">
        <option value="">전체 지국</option>
      </select>
    </div>
    <div>
      <button id="fullscreen">전체화면</button>
      <button id="refresh">새로고침</button>
    </div>
  </div>

  <div id="cards" class="cards">
    <div class="empty">등록 내용을 불러오는 중입니다.</div>
  </div>
</main>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbzfJovFVaL4aFtSXz3_dDwoEWKORo4_PqDLQUZYm-u_FtG42tnEr5XpRqTQdXpMraWp/exec";
const ALL_BRANCHES=["신부천", "신부평", "동부평", "시화", "시흥", "연수", "인천남동", "인천중부", "부천중상동", "신광명", "영종", "서창논현", "인천계양", "신검단", "인천청라", "송도"];
const cards=document.getElementById("cards");
const countEl=document.getElementById("count");
const branchCountEl=document.getElementById("branchCount");
const strip=document.getElementById("branchStrip");
const sortEl=document.getElementById("sort");
const filterEl=document.getElementById("filter");
let cache=[];

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtTime=v=>{
  try{
    const d=new Date(v);
    return new Intl.DateTimeFormat("ko-KR",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}).format(d);
  }catch(e){return "";}
};

function renderBranchStrip(){
  const active=new Set(cache.map(x=>x.branch).filter(Boolean));
  strip.innerHTML=ALL_BRANCHES.map(b=>`<div class="branch-chip ${active.has(b)?"on":""}">${esc(b)}</div>`).join("");
}

function render(){
  let data=[...cache];
  const branch=filterEl.value;
  if(branch) data=data.filter(x=>x.branch===branch);

  if(sortEl.value==="likes"){
    data.sort((a,b)=>(Number(b.likes)||0)-(Number(a.likes)||0));
  }

  if(!data.length){
    cards.innerHTML='<div class="empty">표시할 컨설팅이 없습니다.</div>';
    return;
  }

  cards.innerHTML=data.map(x=>{
    const courses=String(x.selectedCourses||"").split(" + ").filter(Boolean);
    const ageMs=Date.now()-new Date(x.createdAt).getTime();
    const isNew=ageMs >= 0 && ageMs < 30000;
    return `
    <article class="card ${isNew?"new":""}">
      <div class="cardhead">
        <div class="branch">${esc(x.branch)} · ${esc(x.manager)}</div>
        <div class="amount">${Number(x.amount||0).toLocaleString()}원</div>
      </div>
      <div class="body">
        <div class="group">${esc(x.consultingGroup)||"-"}</div>

        <div class="row">
          <b>선택 관리 과목</b>
          <div class="courses">${courses.map(c=>`<span class="course">${esc(c)}</span>`).join("") || "-"}</div>
        </div>

        <div class="row">
          <b>제시 대상</b>
          <div>${esc(x.target)||"-"}</div>
        </div>

        <div class="row">
          <b>상담 소구 포인트 1 · 신규</b>
          <div class="speech">${esc(x.newPoint)||"-"}</div>
        </div>

        <div class="row">
          <b>상담 소구 포인트 2 · 과입</b>
          <div class="speech">${esc(x.overPoint)||"-"}</div>
        </div>

        <div class="footer">
          <div class="time">${fmtTime(x.createdAt)}</div>
          <button class="like" data-id="${esc(x.id)}">공감 ${Number(x.likes)||0}</button>
        </div>
      </div>
    </article>`;
  }).join("");
}

async function load(){
  try{
    const r=await fetch(API_URL+"?action=list&t="+Date.now(),{cache:"no-store"});
    const j=await r.json();
    if(!j.success) throw new Error(j.message||"조회 실패");

    cache=j.data||[];
    countEl.textContent=cache.length;
    branchCountEl.textContent=new Set(cache.map(x=>x.branch).filter(Boolean)).size;
    renderBranchStrip();

    const current=filterEl.value;
    filterEl.innerHTML='<option value="">전체 지국</option>'+ALL_BRANCHES.map(b=>`<option value="${esc(b)}">${esc(b)}</option>`).join("");
    if(ALL_BRANCHES.includes(current)) filterEl.value=current;

    render();
  }catch(err){
    cards.innerHTML='<div class="empty">데이터를 불러오지 못했습니다.<br>'+esc(err.message)+'</div>';
  }
}

cards.addEventListener("click",async e=>{
  const btn=e.target.closest(".like");
  if(!btn) return;
  btn.disabled=true;
  try{
    const r=await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({action:"like",id:btn.dataset.id})
    });
    const j=await r.json();
    if(!j.success) throw new Error(j.message||"공감 실패");
    await load();
  }catch(err){
    alert("공감 처리에 실패했습니다: "+err.message);
  }finally{
    btn.disabled=false;
  }
});

sortEl.addEventListener("change",render);
filterEl.addEventListener("change",render);
document.getElementById("refresh").addEventListener("click",load);
document.getElementById("fullscreen").addEventListener("click",async()=>{
  try{
    if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  }catch(e){}
});

load();
setInterval(load,3000);
</script>
</body>
</html>
