<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>웅진씽크빅 경기인천사업본부용</title>
<style>
:root{--navy:#1d3557;--blue:#2563eb;--bg:#f4f6fa;--line:#dbe2eb;--card:#fff;--muted:#667085}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:var(--bg);color:#172033}
header{background:var(--navy);color:#fff;padding:24px 28px}
header h1{margin:0;font-size:28px} header p{margin:8px 0 0;color:#dbe5f2}
main{max-width:1120px;margin:22px auto;padding:0 18px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px} .full{grid-column:1/-1}
label{display:block;font-weight:800;font-size:14px;margin-bottom:7px}
select,input,textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:12px;font-size:15px;background:#fff}
textarea{min-height:105px;resize:vertical}
.coursebox{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fafbfd}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:800}
.tag{font-size:12px;background:#eaf1ff;color:#2555ad;padding:5px 9px;border-radius:99px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid #cfd8e5;border-radius:999px;padding:8px 12px;background:#fff}
.chip input{width:auto;margin-right:6px}
.summary{display:flex;justify-content:space-between;gap:15px;align-items:center;background:#f7f9fc;border-radius:14px;padding:14px 16px}
.summary strong{font-size:21px;color:var(--blue)}
.btn{width:100%;border:0;border-radius:11px;padding:14px;background:var(--blue);color:#fff;font-weight:800;font-size:16px;cursor:pointer}
.msg{margin-top:10px;text-align:center;font-weight:800} .success{color:#14804a} .error{color:#c62828}

.live-title{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}
.live-title h2{margin:0;font-size:22px}
.live-meta{font-size:13px;color:var(--muted);font-weight:700}
.live-toolbar{display:flex;gap:8px;margin-bottom:12px}
.live-toolbar select,.live-toolbar button{width:auto;padding:8px 10px;font-size:13px;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.cardhead{background:#f7f9fc;padding:11px 13px;display:flex;justify-content:space-between;gap:10px;font-weight:900}
.cardbody{padding:13px}
.group{font-size:17px;font-weight:900;color:#214c9a;margin-bottom:9px}
.row{margin-top:9px;line-height:1.5} .row b{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.live-course{display:inline-block;background:#edf2f7;border-radius:999px;padding:4px 7px;font-size:12px;font-weight:700;margin:2px 3px 2px 0}
.cardfoot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid #edf0f4}
.time{font-size:12px;color:var(--muted)} .like{width:auto;background:#eef3ff;color:#244a9b;border:1px solid #d8e5ff;border-radius:9px;padding:7px 10px;font-weight:800;cursor:pointer}
.empty{grid-column:1/-1;text-align:center;padding:40px;color:var(--muted);background:#fafbfd;border-radius:12px}
@media(max-width:760px){.grid,.cards{grid-template-columns:1fr} .live-title{align-items:flex-start;flex-direction:column}}

.synergy-panel{padding:18px}.synergy-intro{margin-bottom:14px}.synergy-intro h2{margin:0 0 6px;font-size:22px;color:var(--navy)}.synergy-intro p{margin:0;color:var(--muted);line-height:1.6}.preview-link-wrap{margin:0 0 14px}.preview-link{display:inline-flex;align-items:center;gap:8px;text-decoration:none;background:#e53935;color:#fff;border-radius:10px;padding:11px 15px;font-size:14px;font-weight:800;box-shadow:0 4px 14px rgba(229,57,53,.28)}.preview-link:hover{background:#c62828}.preview-link .arrow{font-size:16px}.synergy-image{display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--line)}

.tool-launch{display:flex;align-items:center;justify-content:space-between;gap:18px;text-decoration:none;color:inherit;background:linear-gradient(135deg,#fff 0%,#f5f8ff 100%);border:1px solid #cad6e8;border-radius:16px;padding:18px 20px;margin-bottom:18px;box-shadow:0 8px 24px rgba(29,53,87,.08);transition:.2s ease}
.tool-launch:hover{transform:translateY(-2px);border-color:#9fb3d1;box-shadow:0 12px 30px rgba(29,53,87,.14)}
.tool-main{display:flex;align-items:center;gap:15px}.tool-icon{display:grid;place-items:center;width:56px;height:56px;flex:0 0 56px;border-radius:16px;background:var(--navy);color:#f6c453;font-size:27px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.tool-copy b{display:block;font-size:19px;color:var(--navy);margin-bottom:5px}.tool-copy span{font-size:13px;color:var(--muted);line-height:1.5}.tool-arrow{display:grid;place-items:center;width:36px;height:36px;flex:0 0 36px;border-radius:50%;background:#eaf1ff;color:#2555ad;font-weight:900;font-size:18px}
@media(max-width:520px){.tool-launch{padding:15px}.tool-icon{width:48px;height:48px;flex-basis:48px}.tool-copy b{font-size:17px}.tool-arrow{display:none}}


.usage{display:flex;justify-content:flex-end;min-height:18px;margin:-2px 3px 8px}.usage b{color:#94a3b8;font-size:12px;font-weight:600}.portal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:18px}.portal-card{display:flex;flex-direction:column;min-height:180px;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 8px 24px rgba(29,53,87,.08);transition:.2s ease}.portal-card:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(29,53,87,.14)}.portal-icon{display:grid;place-items:center;width:52px;height:52px;border-radius:15px;font-size:24px;margin-bottom:18px}.portal-card h2{margin:0;color:var(--navy);font-size:19px}.portal-card p{margin:8px 0 20px;color:var(--muted);font-size:13px;line-height:1.6}.portal-go{margin-top:auto;font-size:13px;font-weight:900}.portal-card.calc{border-top:5px solid #1d3557}.portal-card.calc .portal-icon{background:#1d3557;color:#f6c453}.portal-card.calc .portal-go{color:#1d3557}.portal-card.consult{border-top:5px solid #f2b705}.portal-card.consult .portal-icon{background:#f2b705;color:#4b3900}.portal-card.consult .portal-go{color:#9a7200}.portal-card.book{border-top:5px solid #e53935}.portal-card.book .portal-icon{background:#e53935;color:#fff}.portal-card.book .portal-go{color:#c62828}.synergy-intro{margin-bottom:14px}.synergy-intro h2{margin:0;font-size:22px;color:var(--navy)}@media(max-width:760px){.portal{grid-template-columns:1fr}.portal-card{min-height:150px}}

.usage{display:flex;justify-content:flex-end;min-height:18px;margin:-2px 3px 8px}.usage b{color:#94a3b8;font-size:12px;font-weight:600}.portal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:18px}.portal-card{display:flex;flex-direction:column;min-height:180px;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 8px 24px rgba(29,53,87,.08);transition:.2s ease}.portal-card:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(29,53,87,.14)}.portal-icon{display:grid;place-items:center;width:52px;height:52px;border-radius:15px;font-size:24px;margin-bottom:18px}.portal-card h2{margin:0;color:var(--navy);font-size:19px}.portal-card p{margin:8px 0 20px;color:var(--muted);font-size:13px;line-height:1.6}.portal-go{margin-top:auto;font-size:13px;font-weight:900}.portal-card.calc{border-top:5px solid #1d3557}.portal-card.calc .portal-icon{background:#1d3557;color:#f6c453}.portal-card.calc .portal-go{color:#1d3557}.portal-card.consult{border-top:5px solid #f2b705}.portal-card.consult .portal-icon{background:#f2b705;color:#4b3900}.portal-card.consult .portal-go{color:#9a7200}.portal-card.book{border-top:5px solid #e53935}.portal-card.book .portal-icon{background:#e53935;color:#fff}.portal-card.book .portal-go{color:#c62828}.synergy-intro{margin-bottom:14px}.synergy-intro h2{margin:0;font-size:22px;color:var(--navy)}@media(max-width:760px){.portal{grid-template-columns:1fr}.portal-card{min-height:150px}}
</style>
</head>
<body>
<header><h1>웅진씽크빅 경기인천사업본부용</h1><p>KRS를 품고, 현장에서 계속 꺼내 쓰는 상담 무기를 함께 만듭니다.</p></header>
<main>
<div class="usage" aria-hidden="true"><b id="totalVisits">-</b></div>
<section class="portal" aria-label="업무 도구">
 <a class="portal-card calc" data-event="calculator" href="./learning-proposal.html"><span class="portal-icon">▦</span><h2>학습제안계산기</h2><p>과목을 선택하면 결합 할인과 고객 제안 금액을 바로 계산합니다.</p><span class="portal-go">계산기 열기 →</span></a>
 <a class="portal-card consult" data-event="consulting" href="./consulting.html"><span class="portal-icon">✎</span><h2>상담안 만들기</h2><p>신규·과입 상담 소구를 작성하고 다른 지국의 현장 사례와 공유합니다.</p><span class="portal-go">상담안 작성하기 →</span></a>
 <a class="portal-card book" data-event="book" href="./krs-preview.html" target="_blank" rel="noopener"><span class="portal-icon">▤</span><h2>KRS 코어리딩북 미리보기</h2><p>상담 전에 코어리딩북의 구성과 학습 흐름을 빠르게 확인합니다.</p><span class="portal-go">미리보기 열기 ↗</span></a>
</section>
<section class="panel synergy-panel">
<div class="synergy-intro"><h2>KRS 시너지 프로그램</h2></div>
<img src="./krs-synergy.png" alt="KRS 시너지 프로그램 설계 구도" class="synergy-image">
</section>
</main>
<script>
async function record(event){try{await fetch('/api/analytics',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event}),keepalive:true})}catch(e){}}
async function loadUsage(){
 await record('visit');
 try{const r=await fetch('/api/analytics',{cache:'no-store'});const j=await r.json();document.getElementById('totalVisits').textContent=Number(j.total?.visits||0).toLocaleString('ko-KR')}catch(e){document.getElementById('totalVisits').textContent='-'}
}
document.querySelectorAll('[data-event]').forEach(a=>a.addEventListener('click',()=>record(a.dataset.event)));
loadUsage();
</script>
</body></html>
